<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SF BARBER</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6f5;--card:#fff;--dark:#f0f2f1;--bd:#d9dedc;--tx:#111;--mut:#5f6b66;--g:#0a7a35;--gd:#0a7a35;--gl:#0a7a35;--sel:#d9f7e4;--inp:#eef1ef;--red:#dc2626;--yel:#a16207;--blue:#2563eb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1e1e1e;--dark:#171717;--bd:#2e2e2e;--tx:#fff;--mut:#aaa;--g:#00c853;--gd:#00933b;--gl:#22c55e;--sel:#003b18;--inp:#252525;--red:#ef4444;--yel:#facc15;--blue:#3b82f6}}
:root[data-theme="dark"]{--bg:#000;--card:#1e1e1e;--dark:#171717;--bd:#2e2e2e;--tx:#fff;--mut:#aaa;--g:#00c853;--gd:#00933b;--gl:#22c55e;--sel:#003b18;--inp:#252525;--red:#ef4444;--yel:#facc15;--blue:#3b82f6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
.w{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.wide{max-width:880px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hd{text-align:center;padding:10px 0}
.logo{width:120px;height:120px;margin:0 auto 6px;display:block;border-radius:50%}
.mini{width:36px;height:36px;border-radius:50%;vertical-align:middle;margin-right:8px}
.ico{width:22px;height:22px;object-fit:contain}
h1{font-size:34px;color:var(--g)}h2{font-size:18px}h3{font-size:15px;color:var(--g);font-weight:600}
.big{font-size:28px;line-height:1.2}
.tabs{position:relative;display:flex;background:var(--dark);border:1px solid var(--bd);border-radius:20px;padding:5px;gap:4px}
.tabs::before{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 7px);background:var(--gd);border-radius:15px;transition:transform .4s cubic-bezier(.65,0,.25,1)}
.tabs.r::before{transform:translateX(calc(100% + 4px))}
.tabs button{position:relative;flex:1;border:0;background:none;border-radius:15px;padding:10px;font-weight:700;color:var(--mut);transition:color .3s}
.tabs .on{color:#fff}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
input{background:var(--inp);border:1px solid var(--bd);border-radius:14px;padding:13px;color:var(--tx);font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.btn{background:var(--gd);color:#fff;border:0;border-radius:15px;padding:14px;font-weight:700;width:100%}
.btn.gh{background:var(--dark);color:var(--tx);border:1px solid var(--bd)}
.btn.rd{background:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px;border-radius:15px;background:var(--card);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:14px}
.row{flex-direction:row;align-items:center;justify-content:center;font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px}
.ic{background:none;border:0;padding:6px 10px;color:var(--tx);display:inline-flex;align-items:center}
.i{flex:none}.fl{fill:currentColor}
.it .i,.opt .i{color:var(--g)}
.it .y .i{color:var(--yel)}
.ds,.lb{display:inline-flex;align-items:center;gap:8px}
.y.lb{gap:4px}
.g{color:var(--g)}.y{color:var(--yel)}.c{text-align:center;color:var(--mut);font-size:14px}.sm{font-size:13px;color:var(--mut)}
.list{gap:10px}
.it{display:flex;justify-content:space-between;align-items:center;background:var(--dark);border:1px solid var(--bd);border-radius:15px;padding:12px;font-size:14px;font-weight:600;gap:8px}
.av{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--sel);color:var(--g);font-style:normal;margin-right:12px;font-weight:700;vertical-align:middle}
.bh{background:var(--gd);color:#fff;border-radius:0 0 30px 30px;padding:10px 16px 20px;text-align:center;margin:-16px -16px 0}
.bk{display:flex;align-items:center;text-align:left}
.bh .ic{color:#fff}.bh h1{font-size:24px;color:#fff}.bh p{font-size:14px;opacity:.9}
.list2{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;background:var(--dark);border:1px solid var(--bd);border-radius:16px;padding:15px;font-weight:700;color:var(--tx);text-align:left;gap:12px}
.opt.sel{background:var(--sel);border:2px solid var(--gl);padding:14px}
.opt:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{justify-content:center;min-width:64px;padding:12px;border-radius:12px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ags{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.ags{grid-template-columns:1fr 1fr}}
.stt{display:flex;justify-content:space-between;font-weight:700;gap:8px}
.s-ok{color:var(--g)}.s-bl{color:var(--blue)}.s-rd{color:var(--red)}.s-yl{color:var(--yel)}
.acts{display:flex;gap:10px;justify-content:center}.acts .btn{width:auto;padding:10px 18px}
.badge{display:flex;gap:6px;align-items:center;color:var(--g);background:var(--sel);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;align-self:center}
.note{background:var(--sel);color:var(--g);border-radius:12px;padding:10px;font-size:13px;display:flex;align-items:center;gap:8px}
.sum{background:var(--dark);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tot{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--bd);padding-top:10px;margin-top:6px}
.md{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:9}
.md .card{max-width:360px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;z-index:10;max-width:90%;text-align:center;font-size:14px}

/* ===== animações e transições ===== */
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes down{from{opacity:0;transform:translateY(-14px)}}
@keyframes pop{0%{transform:scale(.95)}55%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}}
@keyframes pop2{from{opacity:0;transform:scale(.92) translateY(8px)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 #00c85300)}50%{transform:scale(1.06);filter:drop-shadow(0 0 22px #00c85377)}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes grow{from{width:var(--a)}to{width:var(--b)}}
.w>*,.ags>*,.list>*,.list2>*,.stats>*{animation:up .55s cubic-bezier(.22,.8,.3,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
.w>.bh{animation-name:down}
.still,.still *{animation:none!important}
.hd .logo{animation:float 4s ease-in-out infinite;filter:drop-shadow(0 8px 20px #00c85333)}
.swap>*{animation:up .4s cubic-bezier(.22,.8,.3,1) backwards}
.swap>:nth-child(2){animation-delay:.06s}.swap>:nth-child(3){animation-delay:.12s}.swap>:nth-child(4){animation-delay:.18s}
.btn{transition:transform .15s,filter .2s,box-shadow .25s}
.btn:hover{filter:brightness(1.1);box-shadow:0 8px 20px #00c85333;transform:translateY(-1px)}
.btn:active{transform:scale(.97);box-shadow:none}
.opt{transition:background .25s,border-color .25s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--gl);transform:translateY(-1px)}
.opt:active:not(:disabled){transform:scale(.97)}
.opt.sel{animation:pop .3s ease}
.card,.it,.chip{transition:transform .25s,box-shadow .25s,border-color .25s}
.ags .card:hover{transform:translateY(-3px);box-shadow:0 10px 28px #0003;border-color:var(--gl)}
.it:hover,.chip:hover{border-color:var(--gl);transform:translateY(-2px)}
.ic{border-radius:12px;transition:transform .15s,background .2s}
.ic:hover{background:#7f7f7f26;transform:scale(1.08)}
.ic:active{transform:scale(.92)}
input{transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--g);box-shadow:0 0 0 3px #00c85333}
.pg{height:4px;background:#ffffff40;border-radius:4px;margin:12px 6px 0;overflow:hidden}
.pg i{display:block;height:100%;background:#fff;border-radius:4px;animation:grow .7s cubic-bezier(.22,.8,.3,1) both}
.spl{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.spl .logo{width:140px;height:140px;animation:pulse 1.6s ease-in-out infinite}
.ring{width:38px;height:38px;border:3px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite}
.md{animation:fade .2s}.md .card{animation:pop2 .28s cubic-bezier(.2,.9,.3,1.2)}
.md.bye{opacity:0;transition:opacity .18s;pointer-events:none}
.toast{animation:toast .35s cubic-bezier(.2,.8,.3,1);transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translate(-50%,10px)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

function countUp(){document.querySelectorAll(".cnt").forEach(el=>{const n=+el.dataset.n,c=el.dataset.c=="1";if(!n||RM)return;const t0=performance.now();(function f(t){const k=Math.min((t-t0)/800,1),x=n*(1-Math.pow(1-k,3));el.textContent=c?brl(x):Math.round(x);if(k<1)requestAnimationFrame(f)})(t0)})}
const newB=()=>({svc:[],dia:null,hr:null,barb:null});
let B=newB(),tab="entrar";
const total=()=>B.svc.reduce((a,n)=>a+SERV.find(s=>s[0]==n)[1],0);
const busy=b=>D.ags.some(a=>a.barb==b&&a.dia==B.dia&&a.hr==B.hr&&!["Cancelado","Concluído"].includes(a.st));

function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.append(t);setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),300)},2500)}
function ask(txt,fn,label){const m=document.createElement("div");m.className="md";
m.innerHTML=`<div class="card" role="dialog"><h3>${txt}</h3><div class="two"><button class="btn gh" data-x>Cancelar</button><button class="btn rd" data-y>${label||"Apagar tudo"}</button></div></div>`;
m.onclick=e=>{const t=e.target;if(t.dataset.y!==undefined)fn();if(t==m||t.dataset.x!==undefined||t.dataset.y!==undefined){m.classList.add("bye");setTimeout(()=>m.remove(),180)}};document.body.append(m)}

function route(){if(!D.sess)return login();D.sess.tipo=="admin"?admin():home()}

/* ---------- LOGIN ---------- */
const lform=()=>{const e=tab=="entrar";return `<h2>${e?"Entre na sua conta":"Crie sua conta"}</h2>
${e?"":`<label>Nome<input id="n" autocomplete="name"></label>`}
<label>E-mail<input id="e" type="email" autocomplete="email"></label>
<label>Senha<input id="s" type="password" autocomplete="${e?"current-password":"new-password"}"></label>
<button class="btn">${e?"Entrar":"Criar conta"}</button>`};
function login(){const e=tab=="entrar";
view(`<main class="w"><div class="hd"><img class="logo" src="${IMG.logo}" alt="Logo SF BARBER"><h1>SF BARBER</h1><p>Cuidando do seu visual</p></div>
<div class="tabs${e?"":" r"}"><button data-a="tab" data-v="entrar" class="${e?"on":""}">Entrar</button><button data-a="tab" data-v="cadastrar" class="${e?"":"on"}">Cadastrar</button></div>
<form class="card" id="f" novalidate>${lform()}</form>
<div class="card row"><img class="ico" src="${IMG.loc}" alt="">Avenida José Sarney Nº1</div>
<p class="c">Fale Conosco</p>
<div class="two"><a class="chip" href="#"><img class="ico" src="${IMG.wpp}" alt="">WhatsApp</a><a class="chip" href="#"><img class="ico" src="${IMG.insta}" alt="">Instagram</a></div></main>`);
$("#f").onsubmit=ev=>{ev.preventDefault();tab=="entrar"?doLogin():doSignup()}}

function doLogin(){const e=v("#e").toLowerCase(),s=v("#s");
if(!e||!s)return toast("Informe o e-mail e a senha.");
if(e==ADM.email&&s==ADM.senha){D.sess={email:e,nome:ADM.nome,tipo:"admin"};save();return route()}
const u=D.users.find(u=>u.email==e&&u.senha==s);
if(!u)return toast("E-mail ou senha incorretos.");
D.sess={email:e,nome:u.nome,tipo:"cliente"};save();route()}

function doSignup(){const n=v("#n"),e=v("#e").toLowerCase(),s=v("#s");
if(!n||!e||!s)return toast("Preencha todos os campos.");
if(s.length<4)return toast("A senha deve ter pelo menos 4 caracteres.");
if(e==ADM.email)return toast("Esse e-mail é reservado.");
if(D.users.some(u=>u.email==e))return toast("Essa conta já existe. Faça o login.");
D.users.push({nome:n,email:e,senha:s});D.sess={email:e,nome:n,tipo:"cliente"};save();toast("Conta criada com sucesso!");route()}

<h3>Nossos Serviços</h3><div class="card list">${COMBOS.map(([n,p])=>`<div class="it"><span class="ds">${ic("scissors",18)}${n}</span><b class="g">${brl(p)}</b></div>`).join("")}</div>

const head=(t,s,back,n)=>`<div class="bh"><div class="bk"><button class="ic" data-a="${back}" aria-label="Voltar">${ic("back",24)}</button><b>Agendamento</b></div><h1>${t}</h1><p>${s}</p><div class="pg"><i style="--a:${(n-1)*25}%;--b:${n*25}%"></i></div></div>`;

function step1(){view(`<main class="w">${head("Escolha o serviço que deseja","Selecione uma ou mais opções para continuar","home",1)}
<div class="list2">${SERV.map(([n,p])=>`<button class="opt ${B.svc.includes(n)?"sel":""}" data-a="tsvc" data-v="${n}"><span class="ds">${ic("dot",10)}${n}</span><b class="g">${brl(p)}</b></button>`).join("")}</div>
<button class="btn" data-a="s1n">Continuar</button></main>`)}

function step2(){view(`<main class="w">${head("Selecione o horário","Selecione um dia e um horário disponível","book",2)}
<div class="card"><h3>Dias</h3><div class="chips">${DIAS.map(([a,n])=>`<button class="opt ch ${B.dia==n?"sel":""}" data-a="pd" data-v="${n}" title="${n}">${a}</button>`).join("")}</div></div>
<div class="card"><h3>Horários</h3><div class="chips">${HORAS.map(h=>`<button class="opt ch ${B.hr==h?"sel":""}" data-a="ph" data-v="${h}">${h}</button>`).join("")}</div></div>
<button class="btn" data-a="s2n">Continuar</button></main>`)}

function step3(){if(B.barb&&busy(B.barb))B.barb=null;
view(`<main class="w">${head("Selecione o barbeiro",`${B.dia} • ${B.hr}`,"back2",3)}
<div class="list2">${BARB.map(b=>{const o=busy(b);return `<button class="opt ${B.barb==b?"sel":""}" data-a="pb" data-v="${b}" ${o?"disabled":""}><span><i class="av">${ini(b)}</i>${b}<br><small class="sm">${o?"Indisponível neste horário":"Barbeiro Profissional"}</small></span></button>`}).join("")}</div>
<button class="btn" data-a="s3n">Continuar</button></main>`)}

function step4(){view(`<main class="w"><div class="hd"><img class="logo" src="${IMG.logo}" alt="Logo SF BARBER"><h2>Finalizar Agendamento</h2></div>
<div class="card"><div class="sum"><h3>Resumo</h3>
<span class="g sm">Serviços</span><span>${B.svc.join(", ")}</span>
<span class="g sm">Barbeiro</span><span>${B.barb}</span>
<span class="g sm">Data e Horário</span><span>${B.dia} - ${B.hr}</span>
<div class="tot"><span>Total</span><span class="g">${brl(total())}</span></div></div>
<div class="two"><button class="btn" data-a="ok">Confirmar</button><button class="btn gh" data-a="no">Cancelar</button></div></div></main>`)}

function hist(){const l=D.ags.filter(a=>a.email==D.sess.email);
view(`<main class="w"><div class="bar"><button class="ic" data-a="home" aria-label="Voltar">${ic("back",24)}</button><h2>Histórico</h2><button class="ic" data-a="clr" aria-label="Apagar histórico">${ic("trash",22)}</button></div>
${l.length?l.map(a=>`<div class="card"><b>${a.svc}</b><span class="g">Com: ${a.barb}</span><span class="sm">${a.dia} • ${a.hr}</span><b class="g">${brl(a.val)}</b><b class="${SCLS[a.st]}">${a.st}</b></div>`).join(""):`<p class="c">Você ainda não possui agendamentos.</p>`}</main>`)}

/* ---------- ADMIN ---------- */
function admin(keep){const done=D.ags.filter(a=>a.st=="Concluído"),fat=done.reduce((s,a)=>s+a.val,0);
const stat=(i,t,x,r,c)=>`<div class="card"><span class="g" style="display:flex">${i}</span><span class="sm">${t}</span><b class="cnt" style="font-size:20px" data-n="${r}" data-c="${c?1:0}">${x}</b></div>`;
const btns=a=>a.st=="Pendente"?`<div class="acts"><button class="btn" data-a="st" data-v="${a.id}|Confirmado">Confirmar</button><button class="btn rd" data-a="st" data-v="${a.id}|Cancelado">Cancelar</button></div>`
:a.st=="Confirmado"?`<div class="acts"><button class="btn" data-a="st" data-v="${a.id}|Concluído">Concluir</button></div>`
:a.st=="Concluído"?`<div class="badge">${ic("check",16)} Serviço concluído</div>`:"";
view(`<main class="w wide"><div class="card bar" style="flex-direction:row"><div><b class="g" style="font-size:24px">SF BARBER</b><p class="sm">Olá Administrador</p></div><span class="g" style="display:flex">${ic("shield",32)}</span></div>
<div class="bar"><h2>Dashboard</h2><button class="ic" data-a="out" title="Sair" aria-label="Sair">${ic("out",22)}</button></div>
<div class="stats">${stat(ic("money",28),"Faturamento",brl(fat),fat,1)}${stat(ic("cal",28),"Agendamentos",D.ags.length,D.ags.length)}${stat(ic("users",28),"Clientes",D.users.length,D.users.length)}${stat(ic("done",28),"Concluídos",done.length,done.length)}</div>
<div class="note">${ic("info",18)}<span>O faturamento é atualizado somente quando um agendamento é concluído.</span></div>
<div class="bar"><h2>Agendamentos</h2><button class="ic" data-a="delall" title="Apagar todos os agendamentos" aria-label="Apagar todos os agendamentos">${ic("trash",22)}</button></div>
${D.ags.length?`<div class="ags">${D.ags.map(a=>`<div class="card"><div class="stt"><span>${esc(a.nome)}</span><span class="${SCLS[a.st]}">${a.st}</span></div>
<span class="sm">Serviços: ${a.svc}</span><span class="sm">Barbeiro: ${a.barb}</span><span class="sm">${a.dia} • ${a.hr}</span><b class="g">Valor: ${brl(a.val)}</b>${btns(a)}</div>`).join("")}</div>`:`<p class="c">Não há agendamentos.</p>`}</main>`,keep);if(!keep)countUp()}

/* ---------- AÇÕES ---------- */
const pick=k=>(val,t)=>{const same=B[k]==val;t.parentNode.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));B[k]=same?null:val;if(!same)t.classList.add("sel")};
const act={
tab:val=>{if(val==tab)return;tab=val;$(".tabs").classList.toggle("r",val!="entrar");document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v==val));const f=$("#f");f.innerHTML=lform();f.classList.remove("swap");void f.offsetWidth;f.classList.add("swap")},
out:()=>{D.sess=null;save();B=newB();tab="entrar";login()},
home:()=>home(),hist:()=>hist(),book:()=>step1(),back2:()=>step2(),
tsvc:(val,t)=>{const i=B.svc.indexOf(val);i<0?B.svc.push(val):B.svc.splice(i,1);t.classList.toggle("sel")},
s1n:()=>B.svc.length?step2():toast("Selecione pelo menos um serviço."),
pd:pick("dia"),ph:pick("hr"),pb:pick("barb"),
s2n:()=>!B.dia?toast("Selecione um dia."):!B.hr?toast("Selecione um horário."):step3(),
s3n:()=>{if(!B.barb)return toast("Selecione um barbeiro.");if(busy(B.barb))return toast("Esse horário já está reservado para esse barbeiro.");step4()},
ok:()=>{if(busy(B.barb)){toast("Esse horário acabou de ser reservado.");return step3()}
D.ags.unshift({id:Date.now(),nome:D.sess.nome,email:D.sess.email,svc:B.svc.join(", "),val:total(),barb:B.barb,dia:B.dia,hr:B.hr,st:"Pendente",criado:new Date().toLocaleString("pt-BR")});
save();B=newB();toast("Agendamento realizado com sucesso!");home()},
no:()=>{B=newB();home()},
clr:()=>ask("Excluir todo o seu histórico?",()=>{D.ags=D.ags.filter(a=>a.email!=D.sess.email);save();toast("Histórico excluído.");hist()}),
st:val=>{const[id,to]=val.split("|"),a=D.ags.find(x=>x.id==id);if(!a)return toast("Agendamento não encontrado.");
if(to=="Confirmado"&&a.st!="Pendente")return toast("Esse agendamento não está pendente.");
if(to=="Concluído"&&a.st!="Confirmado")return toast("Somente agendamentos confirmados podem ser concluídos.");
a.st=to;save();admin(true)},
delall:()=>ask("Tem certeza que deseja apagar todos os dados?",()=>{D.ags=[];save();toast("Todos os agendamentos foram excluídos.");admin()})
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&act[t.dataset.a])act[t.dataset.a](t.dataset.v,t)});

if(D.sess&&D.sess.tipo!="admin"){const u=D.users.find(x=>x.email==D.sess.email);u?D.sess.nome=u.nome:D.sess=null}
const splash=()=>view(`<div class="spl"><img class="logo" src="${IMG.logo}" alt="SF BARBER"><div class="ring" role="status" aria-label="Carregando"></div><p class="sm">Carregando...</p></div>`);
if(!D.sess&&!RM){splash();setTimeout(route,1500)}else route();
</script>
</body>
</html>
